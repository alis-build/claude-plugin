name: Feature request
description: Suggest something the plugin could do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How it could work. Rough is fine.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Primer and session context
        - Permission gate and guarded actions
        - Skills (discover, capture, handoff, frontend-preview)
        - Live operation rows and panes (function hooks)
        - Secret masking and warnings
        - Something else
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried instead
